<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusWiki | Base de Conocimiento Moderna</title>
    
    <!-- Fuente Inter para una lectura cómoda y moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Enlace a nuestra hoja de estilos personalizada -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Barra de Navegación Superior -->
    <header class="navbar">
        <div class="navbar-container">
            
            <!-- Botón Menú Móvil y Logo -->
            <div class="navbar-left">
                <button id="mobile-menu-btn" class="icon-btn mobile-only" aria-label="Abrir menú">
                    <i data-lucide="menu"></i>
                </button>
                <a href="#" onclick="loadArticle('bienvenida'); return false;" class="brand-logo">
                    <div class="brand-icon">
                        <i data-lucide="book-open"></i>
                    </div>
                    <span class="brand-text">Nexus<span class="brand-accent">Wiki</span></span>
                </a>
            </div>

            <!-- Buscador Central -->
            <div class="search-wrapper">
                <div class="search-box">
                    <i data-lucide="search" class="search-icon"></i>
                    <input type="text" id="search-input" placeholder="Buscar artículos, temas o etiquetas...">
                    <div id="search-results" class="search-dropdown hidden"></div>
                </div>
            </div>

            <!-- Controles Derechos -->
            <div class="navbar-right">
                <button onclick="openNewArticleModal()" class="btn-primary desktop-only">
                    <i data-lucide="plus"></i>
                    <span>Nuevo Artículo</span>
                </button>
                <button id="theme-toggle" class="icon-btn" title="Cambiar tema claro/oscuro">
                    <i data-lucide="moon" id="theme-icon-dark" class="hidden"></i>
                    <i data-lucide="sun" id="theme-icon-light"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal (3 Columnas) -->
    <div class="layout-wrapper">
        
        <!-- Fondo oscuro en móvil al abrir menú -->
        <div id="sidebar-backdrop" class="backdrop hidden"></div>

        <!-- Barra Lateral Izquierda (Categorías y Artículos) -->
        <aside id="sidebar" class="sidebar-left">
            <nav id="sidebar-nav" class="sidebar-nav">
                <!-- Generado dinámicamente por scripts.js -->
            </nav>
            
            <div class="mobile-create-wrapper mobile-only">
                <button onclick="openNewArticleModal()" class="btn-primary full-width">
                    <i data-lucide="plus"></i>
                    <span>Crear Nuevo Artículo</span>
                </button>
            </div>
        </aside>

        <!-- Área Central de Lectura y Edición -->
        <main class="main-content">
            <div class="article-container">
                
                <!-- Migas de pan y botón editar -->
                <div class="article-topbar">
                    <nav class="breadcrumbs" id="breadcrumbs">
                        <span>Wiki</span>
                        <i data-lucide="chevron-right" class="crumb-sep"></i>
                        <span id="crumb-category" class="crumb-active">General</span>
                    </nav>
                    <button onclick="toggleEditMode()" id="edit-btn" class="btn-secondary">
                        <i data-lucide="edit-3"></i>
                        <span>Editar página</span>
                    </button>
                </div>

                <!-- Vista de Lectura del Artículo -->
                <article id="article-view" class="article-card">
                    <header class="article-header">
                        <div class="article-tags" id="article-tags"></div>
                        <h1 id="article-title" class="article-title"></h1>
                        <p id="article-subtitle" class="article-subtitle"></p>
                        <div class="article-meta">
                            <span><i data-lucide="clock"></i> <span id="article-date">Hoy</span></span>
                            <span><i data-lucide="book"></i> Lectura: <span id="article-readtime">2 min</span></span>
                        </div>
                    </header>

                    <div id="article-content" class="article-body">
                        <!-- Contenido inyectado por scripts.js -->
                    </div>
                </article>

                <!-- Vista de Edición Rápida -->
                <section id="edit-view" class="edit-card hidden">
                    <div class="edit-header">
                        <h2><i data-lucide="pen-tool"></i> Editando Artículo</h2>
                        <span class="badge">Modo Editor</span>
                    </div>
                    
                    <div class="form-group">
                        <label for="edit-title">Título</label>
                        <input type="text" id="edit-title" class="form-input">
                    </div>
                    <div class="form-group">
                        <label for="edit-subtitle">Subtítulo / Resumen</label>
                        <input type="text" id="edit-subtitle" class="form-input">
                    </div>
                    <div class="form-group">
                        <label for="edit-content">Contenido (Soporta etiquetas HTML como &lt;h2&gt;, &lt;p&gt;, &lt;ul&gt;)</label>
                        <textarea id="edit-content" rows="12" class="form-textarea"></textarea>
                    </div>
                    <div class="form-actions">
                        <button onclick="toggleEditMode()" class="btn-ghost">Cancelar</button>
                        <button onclick="saveArticleEdits()" class="btn-primary">Guardar Cambios</button>
                    </div>
                </section>

                <!-- Paginación Anterior / Siguiente -->
                <div class="pagination-grid" id="article-pagination"></div>
            </div>
        </main>

        <!-- Barra Lateral Derecha (Tabla de Contenidos) -->
        <aside class="sidebar-right">
            <div class="toc-wrapper">
                <h4 class="toc-title">En esta página</h4>
                <ul id="toc-list" class="toc-list">
                    <!-- Generado automáticamente por scripts.js -->
                </ul>
            </div>
        </aside>
    </div>

    <!-- Modal para Crear Nuevo Artículo -->
    <div id="new-article-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Crear Nuevo Artículo</h3>
                <button onclick="closeNewArticleModal()" class="icon-btn">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="new-category">Categoría</label>
                    <select id="new-category" class="form-input">
                        <option value="Diario y Relatos">Diario y Relatos</option>
                        <option value="Personajes">Personajes</option>
                        <option value="Primeros Pasos">Primeros Pasos</option>
                        <option value="Guías y Conceptos">Guías y Conceptos</option>
                        <option value="Recursos">Recursos</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="new-title">Título del Artículo</label>
                    <input type="text" id="new-title" placeholder="Ej. Arquitectura del Proyecto" class="form-input">
                </div>
                <div class="form-group">
                    <label for="new-subtitle">Descripción corta</label>
                    <input type="text" id="new-subtitle" placeholder="Breve resumen del tema..." class="form-input">
                </div>
                <div class="form-group">
                    <label for="new-content">Contenido inicial</label>
                    <textarea id="new-content" rows="4" placeholder="Escribe el contenido aquí..." class="form-input"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="closeNewArticleModal()" class="btn-ghost">Cancelar</button>
                <button onclick="createNewArticle()" class="btn-primary">Publicar en Wiki</button>
            </div>
        </div>
    </div>

    <!-- Notificación Flotante (Toast) -->
    <div id="toast" class="toast">
        <i data-lucide="check-circle-2" class="toast-icon"></i>
        <span id="toast-msg">Cambios guardados</span>
    </div>

    <!-- Enlace a nuestra lógica JavaScript -->
    <script src="scripts.js"></script>
</body>
</html>
